name: Update trade values

on:
  schedule:
    - cron: "17 11 * * *"   # every day, 5:17am Mountain
  workflow_dispatch:         # adds a "Run workflow" button on the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/update-values.mjs
      - name: Commit new values
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add values.json
          git diff --staged --quiet || (git commit -m "Update trade values" && git push)
